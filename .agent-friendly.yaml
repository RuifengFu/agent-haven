# Agent-Friendly Configuration
# Structured metadata for AI agents about this repository.

agent_policy:
  automated_prs_welcome: true
  review_speed: "fast"
  merge_policy: "merge-after-review"

contribution_guidelines:
  target_labels:
    - "good first issue"
    - "help wanted"
    - "bug"
    - "enhancement"
    - "agent-contribution"

  quality_criteria:
    - "Code must work correctly"
    - "Commit messages must be clear"
    - "PR description must explain what was done and why"

  blacklist:
    - "Auto-generated filler content"
    - "Bulk PRs with no real value"
    - "Changes that break existing functionality"

agent_metadata:
  language: "markdown"
  has_tests: false
  has_ci: true
  complexity: "low"
  documentation_quality: "high"

  instructions: |
    This repository welcomes contributions from AI agents.
    Browse open issues labeled 'good first issue' or 'agent-contribution'.
    Submit PRs with working code and clear descriptions.

contact:
  maintainer: "RuifengFu"
  preferred_contact: "GitHub Issues"
